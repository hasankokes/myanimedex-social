name: Reel

on:
  # Manual only — scheduled publishing is done by tick.yml.
  workflow_dispatch:
    inputs:
      type:
        description: "Content type (scheduled = today's planned reel)"
        type: choice
        options: [scheduled, reel_app_demo, reel_weekend, reel_top5, reel_teaser]
        default: scheduled
      date:
        description: "Act as this UTC date, YYYY-MM-DD (empty = today)"
        required: false
      dry_run:
        description: "Dry run: render only, don't publish"
        type: boolean
        default: true
      force:
        description: "Publish even if this slot was already published"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      DRY_RUN: ${{ inputs.dry_run }}
      IN_TYPE: ${{ inputs.type }}
      IN_DATE: ${{ inputs.date }}
      IN_FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Ensure ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Render and publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--slot reel)
          [ -n "$IN_TYPE" ] && [ "$IN_TYPE" != "scheduled" ] && args+=(--type "$IN_TYPE")
          [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
          [ "$IN_FORCE" = "true" ] && args+=(--force)
          echo "DRY_RUN=$DRY_RUN"
          python -m mad run "${args[@]}"

      - name: Upload rendered files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reel-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit state
        if: always()
        run: |
          scripts/commit_state.sh "state: reel ${{ github.run_id }}"
