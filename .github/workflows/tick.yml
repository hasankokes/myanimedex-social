name: Tick

# Publishes every slot that is due (stories 14:00, posts/reels 19:00 UTC; config.yaml → schedule).
# Triggered at those exact times (+35 and +70 min retries) by pg_cron in the app's Supabase
# project (migration 20261029170000_instagram_tick_cron.sql in hasankokes/my-anime-dex), because
# GitHub's own cron skipped most runs. Idempotent: nothing due -> no-op. Can also be run by hand.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      DRY_RUN: ${{ vars.DRY_RUN == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: What's due
        id: due
        run: |
          python -m mad tick --list | tee due.txt
          if grep -q '^reel ' due.txt; then echo "reel=true" >> "$GITHUB_OUTPUT"; fi
          if [ -s due.txt ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi

      - name: Ensure ffmpeg
        if: steps.due.outputs.reel == 'true'
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Publish due slots
        if: steps.due.outputs.any == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "DRY_RUN=$DRY_RUN"
          python -m mad tick

      - name: Upload rendered files
        if: always() && steps.due.outputs.any == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tick-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit state
        if: always() && steps.due.outputs.any == 'true'
        run: |
          scripts/commit_state.sh "state: tick ${{ github.run_id }}"
