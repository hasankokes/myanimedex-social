name: Setup
description: Python, dependencies and the AniList response cache
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - run: pip install -r requirements.txt
      shell: bash
    - uses: actions/cache@v4
      with:
        path: .cache/anilist
        key: anilist-${{ github.run_id }}
        restore-keys: anilist-
