# Wednesday "app feature" posts are taken from this list in order (top → bottom,
# then it starts over). The last published id is stored in state/posted_state.json.
#
# Fields:
#   id           unique, never reuse (used to remember the rotation position)
#   title        headline on the image and in the caption (keep it under ~40 chars)
#   description  1–2 short sentences, shown on the image and in the caption (~160 chars max)
#   kicker       optional small label above the title (default "APP FEATURE")
#   screenshot   optional path to a phone screenshot (PNG/JPG, portrait) inside this repo
#   enabled      optional, false = skip
#
# ⚠️ Screenshots must not show official posters or character art (copyright rule).
#    Crop/blur them first or leave `screenshot` empty — the template is typographic.
#
# The entries below are examples — replace them with your own.

features:
  - id: airing-calendar
    title: Never miss a new episode
    description: The airing calendar shows every episode of the week in your local time, so you always know what drops today.
    kicker: APP FEATURE

  - id: languages
    title: Your anime app, in 15 languages
    description: English, Türkçe, Español, Português, Deutsch, Français and more. Pick yours in settings.
    screenshot: assets/screenshots/language.png

  - id: shared-lists
    title: Build lists with friends
    description: Create a list, invite collaborators and decide your next watch together.

  - id: arena
    title: Anime Arena
    description: Bracket battles between anime. Vote match by match and crown your all-time favorite.
    kicker: GAME MODE

  - id: watch-status
    title: Track every episode
    description: Watching, completed, plan to watch — your whole anime history in one place, synced across devices.
